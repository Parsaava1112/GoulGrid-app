name: goulgrid
description: A habit and task manager with gamification.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  sqflite_common_ffi: ^2.3.3  
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.2
  fl_chart: ^0.66.0
  confetti: ^0.7.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true          # فعال‌سازی تولید آیکون ویندوز
  image_path: "assets/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
