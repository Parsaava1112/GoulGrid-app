name: goulgrid
description: A habit and task manager.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  fl_chart: ^0.66.0
  confetti: ^0.7.0
  intl: ^0.19.0   # نسخه سازگار
  # برای ویندوز/دسکتاپ (اختیاری، اما اگر خواستید جداگانه تست کنید)
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.0   # اگر از LogService استفاده می‌کنید

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#00897B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
